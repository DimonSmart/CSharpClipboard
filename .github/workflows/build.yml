name: Build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CSharpClipboard.sln
      - run: dotnet build CSharpClipboard.sln -c Release --no-restore
      - run: dotnet test CSharpClipboard.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Package macOS and verify native bridge
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            TestResults/*.trx
